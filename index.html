<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>2026학년도 2학기 학급별 시간표</title>
<style>
  :root{
    --blue:#2563eb;
    --blue-dark:#1d4ed8;
    --bg:#f3f4f8;
    --card:#ffffff;
    --border:#e5e7eb;
    --text:#111827;
    --sub:#6b7280;
    --hl-bg:#fff3c4;
    --hl-border:#f5b100;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family:"Pretendard","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
    background:var(--bg);
    color:var(--text);
    padding:32px 16px 60px;
  }
  .wrap{max-width:1080px;margin:0 auto;}
  h1{
    text-align:center;
    font-size:26px;
    font-weight:800;
    margin:0 0 6px;
  }
  .subtitle{
    text-align:center;
    color:var(--sub);
    font-size:14px;
    margin:0 0 24px;
  }
  .search-card{
    background:var(--card);
    border:1px solid var(--border);
    border-radius:16px;
    padding:20px 24px;
    margin-bottom:20px;
    box-shadow:0 1px 2px rgba(0,0,0,0.03);
  }
  .search-label{
    font-size:13px;
    font-weight:700;
    color:var(--text);
    margin-bottom:8px;
  }
  .search-row{
    display:flex;
    gap:10px;
  }
  .search-row input{
    flex:1;
    padding:12px 16px;
    border:1px solid var(--border);
    border-radius:10px;
    font-size:15px;
    outline:none;
    background:#fafafa;
  }
  .search-row input:focus{
    border-color:var(--blue);
    background:#fff;
  }
  .search-row button{
    padding:0 20px;
    border:none;
    border-radius:10px;
    background:#111827;
    color:#fff;
    font-size:14px;
    font-weight:600;
    cursor:pointer;
    white-space:nowrap;
  }
  .search-row button:hover{background:#000;}
  .match-summary{
    margin-top:10px;
    font-size:13px;
    color:var(--blue-dark);
    font-weight:600;
    min-height:18px;
  }
  .tabs{
    display:flex;
    gap:8px;
    margin-bottom:16px;
    flex-wrap:wrap;
  }
  .tab-btn{
    padding:10px 22px;
    border-radius:10px;
    border:1px solid var(--border);
    background:var(--card);
    font-size:14px;
    font-weight:600;
    color:var(--text);
    cursor:pointer;
  }
  .tab-btn.active{
    background:var(--blue);
    color:#fff;
    border-color:var(--blue);
  }
  .table-card{
    background:var(--card);
    border:1px solid var(--border);
    border-radius:16px;
    overflow:hidden;
    box-shadow:0 1px 2px rgba(0,0,0,0.03);
  }
  table{
    width:100%;
    border-collapse:collapse;
  }
  thead th{
    background:#f8fafc;
    color:#374151;
    font-size:13px;
    font-weight:700;
    padding:14px 8px;
    border-bottom:1px solid var(--border);
    text-align:center;
  }
  thead th.period-col{width:70px;}
  tbody td{
    padding:12px 8px;
    text-align:center;
    border-bottom:1px solid var(--border);
    border-right:1px solid var(--border);
    font-size:14px;
    transition:background .15s, opacity .15s;
  }
  tbody td:last-child{border-right:none;}
  tbody tr:last-child td{border-bottom:none;}
  .period-cell{
    background:#f8fafc;
    font-weight:700;
    color:#4b5563;
  }
  .cell-empty{color:#d1d5db;}
  .subject{font-weight:700;}
  .teacher{
    display:block;
    color:var(--sub);
    font-size:12px;
    margin-top:2px;
  }
  .cell-match{
    background:var(--hl-bg) !important;
    box-shadow:inset 0 0 0 2px var(--hl-border);
    border-radius:6px;
  }
  .cell-dim{opacity:.35;}
  footer{
    text-align:center;
    color:#9ca3af;
    font-size:12px;
    margin-top:24px;
  }
  @media (max-width:640px){
    thead th, tbody td{font-size:12px;padding:8px 4px;}
    h1{font-size:21px;}
    .search-row{flex-direction:column;}
    .search-row button{padding:12px;}
  }
</style>
</head>
<body>
<div class="wrap">
  <h1>2026학년도 2학기 학급별 시간표</h1>
  <p class="subtitle">교사명 또는 과목명으로 검색하여 해당 수업을 확인할 수 있습니다.</p>

  <div class="search-card">
    <div class="search-label">교사/과목 검색</div>
    <div class="search-row">
      <input id="searchInput" type="text" placeholder="예: 황훈희, 수학, 정영선...">
      <button id="resetBtn">초기화</button>
    </div>
    <div class="match-summary" id="matchSummary"></div>
  </div>

  <div class="tabs" id="tabs"></div>

  <div class="table-card">
    <table>
      <thead>
        <tr>

          <th>1-1</th><th>1-2</th><th>2-1</th><th>2-2</th><th>3-1</th><th>3-2</th>
        </tr>
      </thead>
      <tbody id="tbody"></tbody>
    </table>
  </div>

</div>

const DAYS = ["월요일","화요일","수요일","목요일","금요일"];
const CLASSES = ["1-1","1-2","2-1","2-2","3-1","3-2"];

let currentDay = "월요일";
let query = "";

const tabsEl = document.getElementById('tabs');
const tbodyEl = document.getElementById('tbody');
const searchInput = document.getElementById('searchInput');
const resetBtn = document.getElementById('resetBtn');
const matchSummaryEl = document.getElementById('matchSummary');

function buildTabs(){
  tabsEl.innerHTML = "";
  DAYS.forEach(day=>{
    const btn = document.createElement('button');
    btn.className = 'tab-btn' + (day===currentDay ? ' active' : '');
    btn.textContent = day;
    btn.onclick = ()=>{ currentDay = day; render(); };
    tabsEl.appendChild(btn);
  });
}

function countMatches(){
  if(!query) return 0;
  let n = 0;
  DAYS.forEach(day=>{
    (DATA[day]||[]).forEach(row=>{
      CLASSES.forEach(cls=>{
        const c = row.classes[cls];
        if(!c) return;
        if(c.subject.includes(query) || c.teacher.includes(query)) n++;
      });
    });
  });
  return n;
}

function render(){
  buildTabs();
  const rows = DATA[currentDay] || [];
  tbodyEl.innerHTML = "";
  rows.forEach(row=>{
    const tr = document.createElement('tr');
    const th = document.createElement('td');
    th.className = 'period-cell';
    th.textContent = row.period.trim() + '교시';
    tr.appendChild(th);
    CLASSES.forEach(cls=>{
      const c = row.classes[cls];
      const td = document.createElement('td');
      if(!c || !c.subject){
        td.innerHTML = '<span class="cell-empty">-</span>';
      } else {
        const isMatch = query && (c.subject.includes(query) || c.teacher.includes(query));
        td.innerHTML = `<span class="subject">${c.subject}</span><span class="teacher">${c.teacher}</span>`;
        if(query){
          td.classList.add(isMatch ? 'cell-match' : 'cell-dim');
        }
      }
      tr.appendChild(td);
    });
    tbodyEl.appendChild(tr);
  });

  if(query){
    const total = countMatches();
    matchSummaryEl.textContent = total > 0
      ? `"${query}" 검색 결과: 전체 ${total}건 (현재 요일에서 노란색으로 표시)`
      : `"${query}"에 대한 검색 결과가 없습니다.`;
  } else {
    matchSummaryEl.textContent = "";
  }
}

searchInput.addEventListener('input', (e)=>{
  query = e.target.value.trim();
  render();
});

resetBtn.addEventListener('click', ()=>{
  query = "";
  searchInput.value = "";
  render();
});

render();
</script>
</body>
</html>
